<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Street panorama</title><style>html,body,#panorama{margin:0;width:100%;height:100%;overflow:hidden;background:#203b30}</style></head><body><div id="panorama"></div><script>
'use strict';
// One public MapKit viewer per runtime avoids the shared-renderer loading stall.
window.loadWalkScene=(position)=>new Promise(resolve=>{
 let view,finished=false;
 const done=ok=>{if(finished)return;finished=true;clearTimeout(timeout);resolve(ok);};
 const timeout=setTimeout(()=>done(false),12000);
 window.initWalkingMapKit=()=>{
  try{
   mapkit.addEventListener('configuration-change',event=>{
    if(event.status!=='Initialized'||view)return;
    try{
     view=new mapkit.LookAround(document.getElementById('panorama'),new mapkit.Coordinate(position.lat,position.lon),{isNavigationEnabled:false,isScrollEnabled:true,isZoomEnabled:true,showsDialogControl:false,showsCloseControl:false,showsPointsOfInterest:false});
     view.addEventListener('load',()=>done(true));view.addEventListener('error',()=>done(false));
     if(view.readyState==='complete')done(true);
    }catch{done(false);}
   });
   mapkit.init({authorizationCallback:callback=>callback(parent.ROAM_MAPKIT_TOKEN)});
  }catch{done(false);}
 };
 const script=document.createElement('script');script.src='https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.core.js';script.crossOrigin='anonymous';script.dataset.libraries='look-around';script.dataset.callback='initWalkingMapKit';script.onerror=()=>done(false);document.head.append(script);
});
document.addEventListener('keydown',event=>{
 if(event.altKey||event.metaKey||event.ctrlKey)return;
 const action={ArrowUp:'forward',w:'forward',ArrowDown:'back',s:'back',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',Escape:'sky'}[event.key.length===1?event.key.toLowerCase():event.key];
 if(action){event.preventDefault();event.stopImmediatePropagation();if(!event.repeat)parent.roamWalkAction(action);}
},true);
</script></body></html>
