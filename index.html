<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#234e42"><link rel="icon" href="data:,"><title>Roam at Home · Nashville</title><link rel="stylesheet" href="style.css?v=202610251722"><script src="config.js?v=202610251722" defer></script><script src="app.js?v=202610251722" defer></script></head>
<body><a class="skip" href="#panel">Skip to places</a><header><a class="brand" href="./">⌂ Roam at Home</a><select id="neighborhood" aria-label="Neighborhood"><option value="downtown">Downtown &amp; Broadway</option><option value="12south">12 South</option><option value="midtown">Midtown</option><option value="fivepoints">East Nashville · Five Points</option></select></header><main><section class="map-area" aria-label="Nashville map"><div id="map"></div><div id="map-status" role="status">Finding Nashville…</div></section><button id="browse" aria-label="Browse places" aria-expanded="false">☰</button><section hidden id="panel" tabindex="-1" aria-label="Explore and plan"><button id="close-panel" aria-label="Close sheet">×</button><nav aria-label="Explore or plan"><button id="explore-tab" class="tab active" aria-pressed="true">Explore places</button><button id="trip-tab" class="tab" aria-pressed="false">My Trip <span id="count">0</span></button></nav><div id="content"></div><footer>Free - no ads, nothing to buy. Made with Claude, Anthropic's AI, and other AI tools.</footer></section></main><div id="place-card" hidden></div><footer class="map-footer">Free · No ads · Made with AI</footer><div id="sky-hint">Tap a street to walk</div><div id="walk-notice" hidden role="status"></div><div id="announcement" class="sr-only" role="status" aria-live="polite"></div><section id="walk-view" hidden aria-label="Full-screen street walk"><div id="street"></div><div id="street-status" role="status"></div><button id="walk-mini" aria-label="Back up to the sky"><span id="walk-mini-map"></span><span id="walk-direction" aria-hidden="true">▲</span><span class="mini-label">Back to sky</span></button><div id="walk-pad" role="group" aria-label="Walk controls"><span id="walk-heading">Drag to look</span><button data-action="forward" aria-label="Walk forward (Up or W)">↑</button><button data-action="left" aria-label="Turn walking direction left (Left or A)">↶</button><span class="pad-center" aria-hidden="true">●</span><button data-action="right" aria-label="Turn walking direction right (Right or D)">↷</button><button data-action="back" aria-label="Walk back (Down or S)">↓</button></div></section><div id="walk-bar" hidden aria-label="Walk controls"></div></body></html>
